<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find My Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,sans-serif;background:#f7f9fc;color:#172033}
.find-course{max-width:1100px;margin:50px auto;padding:0 20px}
.fc-box{background:#fff;border:1px solid #e8edf4;border-radius:20px;padding:34px;box-shadow:0 12px 35px rgba(20,35,60,.06)}
.fc-head{text-align:center;margin-bottom:28px}
.fc-head .tag{display:inline-block;background:#eef4ff;color:#274896;font-size:12px;font-weight:600;padding:7px 12px;border-radius:30px;margin-bottom:10px}
.fc-head h2{font-size:30px;margin:0 0 8px}
.fc-head p{margin:0;color:#687386;font-size:14px}
.progress{height:5px;background:#edf0f5;border-radius:10px;margin:0 auto 28px;max-width:600px;overflow:hidden}
.progress span{display:block;height:100%;width:25%;background:#274896;border-radius:10px;transition:.3s}
.step{display:none;max-width:700px;margin:auto}
.step.active{display:block}
.step h3{font-size:20px;text-align:center;margin:0 0 20px}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.option{border:1px solid #e2e7ef;background:#fff;border-radius:12px;padding:16px;text-align:left;cursor:pointer;font-family:inherit;transition:.2s}
.option:hover,.option.selected{border-color:#274896;background:#f4f7ff}
.option strong{display:block;font-size:14px}
.option small{display:block;color:#7b8494;margin-top:3px}
.actions{display:flex;justify-content:center;gap:10px;margin-top:24px}
.btn{border:0;border-radius:10px;padding:12px 22px;font-family:inherit;font-weight:600;cursor:pointer}
.back{background:#eef1f5;color:#394457}
.next{background:#274896;color:#fff}
.result{display:none;max-width:850px;margin:auto}
.result.active{display:block}
.result-title{text-align:center;margin-bottom:20px}
.result-title h3{margin:0 0 5px;font-size:22px}
.result-title p{margin:0;color:#6d7788;font-size:13px}
.course-list{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.course{border:1px solid #e3e8ef;border-radius:14px;padding:20px;background:#fff}
.course .icon{width:42px;height:42px;border-radius:10px;background:#eef4ff;color:#274896;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:14px}
.course h4{margin:0 0 6px;font-size:16px}
.course p{font-size:12px;color:#727d8e;margin:0 0 15px;line-height:1.6}
.course a{font-size:12px;color:#274896;font-weight:600;text-decoration:none}
.restart{display:block;margin:24px auto 0;background:#eef1f5;color:#394457}
@media(max-width:700px){
.fc-box{padding:24px 16px}.fc-head h2{font-size:24px}
.options,.course-list{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section class="find-course">
<div class="fc-box">

<div class="fc-head">
<span class="tag">COURSE DISCOVERY</span>
<h2>Find My Course</h2>
<p>Answer 4 simple questions and discover courses that match you.</p>
</div>

<div class="progress"><span id="progressBar"></span></div>

<div class="step active" data-step="1">
<h3>What have you completed?</h3>
<div class="options">
<button class="option" data-value="12th"><strong>12th</strong><small>Higher secondary</small></button>
<button class="option" data-value="Diploma"><strong>Diploma</strong><small>Technical or professional diploma</small></button>
<button class="option" data-value="Graduation"><strong>Graduation</strong><small>Bachelor's degree completed</small></button>
<button class="option" data-value="Working"><strong>Working Professional</strong><small>Looking to upskill or change career</small></button>
</div>
</div>

<div class="step" data-step="2">
<h3>What are you interested in?</h3>
<div class="options">
<button class="option" data-value="Technology"><strong>Technology</strong><small>Software, IT & data</small></button>
<button class="option" data-value="Business"><strong>Business</strong><small>Management & entrepreneurship</small></button>
<button class="option" data-value="Finance"><strong>Finance</strong><small>Accounting, banking & commerce</small></button>
<button class="option" data-value="Design"><strong>Design</strong><small>Creative & visual fields</small></button>
</div>
</div>

<div class="step" data-step="3">
<h3>What is your budget?</h3>
<div class="options">
<button class="option" data-value="low"><strong>Under ₹1 Lakh</strong><small>Budget-friendly options</small></button>
<button class="option" data-value="mid"><strong>₹1–2 Lakh</strong><small>Mid-range options</small></button>
<button class="option" data-value="high"><strong>₹2 Lakh+</strong><small>Premium options</small></button>
</div>
</div>

<div class="step" data-step="4">
<h3>How would you like to study?</h3>
<div class="options">
<button class="option" data-value="Online"><strong>Online</strong><small>Study from anywhere</small></button>
<button class="option" data-value="Offline"><strong>Offline</strong><small>Campus-based learning</small></button>
<button class="option" data-value="Hybrid"><strong>Hybrid</strong><small>Online + campus learning</small></button>
<button class="option" data-value="Any"><strong>I'm Open to Anything</strong><small>Show all suitable options</small></button>
</div>
</div>

<div class="actions" id="actions">
<button class="btn back" id="backBtn" type="button" style="display:none">Back</button>
<button class="btn next" id="nextBtn" type="button">Continue</button>
</div>

<div class="result" id="result">
<div class="result-title">
<h3>Courses Recommended For You</h3>
<p>Based on your answers, these courses may be a good match.</p>
</div>
<div class="course-list" id="courseList"></div>
<button class="btn restart" id="restartBtn" type="button">Start Again</button>
</div>

</div>
</section>

<script>
(function(){
const root=document.querySelector('.find-course');
const steps=[...root.querySelectorAll('.step')];
const progress=root.querySelector('#progressBar');
const next=root.querySelector('#nextBtn');
const back=root.querySelector('#backBtn');
const actions=root.querySelector('#actions');
const result=root.querySelector('#result');
const list=root.querySelector('#courseList');
let current=0;
const answers={};

function showStep(){
 steps.forEach((s,i)=>s.classList.toggle('active',i===current));
 progress.style.width=((current+1)/steps.length*100)+'%';
 back.style.display=current>0?'inline-block':'none';
 next.textContent=current===steps.length-1?'Show My Courses':'Continue';
}

steps.forEach((step,index)=>{
 step.querySelectorAll('.option').forEach(btn=>{
  btn.addEventListener('click',()=>{
   step.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));
   btn.classList.add('selected');
   answers[index]=btn.dataset.value;
  });
 });
});

next.addEventListener('click',()=>{
 if(!answers[current]){
  alert('Please select an option to continue.');
  return;
 }
 if(current<steps.length-1){
  current++;
  showStep();
 }else{
  showResults();
 }
});

back.addEventListener('click',()=>{
 if(current>0){current--;showStep();}
});

function showResults(){
 steps.forEach(s=>s.style.display='none');
 actions.style.display='none';
 progress.parentElement.style.display='none';
 result.classList.add('active');

 const interest=answers[1];
 const courses={
  Technology:[
   ['BCA','Computer Applications • Software & IT'],
   ['B.Sc Computer Science','Computing • Programming & Data'],
   ['BCA AI & Data Science','AI • Data • Technology']
  ],
  Business:[
   ['BBA','Business Administration • Management'],
   ['BBA Business Analytics','Business • Data • Analytics'],
   ['B.Com','Commerce • Finance • Business']
  ],
  Finance:[
   ['B.Com','Commerce • Accounting & Finance'],
   ['B.Com Finance','Finance • Banking • Accounting'],
   ['BBA Finance','Management • Finance • Business']
  ],
  Design:[
   ['B.Des','Design • Creative Practice'],
   ['BA Visual Communication','Media • Visual Design'],
   ['BCA UI/UX Design','Technology • Product Design']
  ]
 };
 const chosen=courses[interest]||courses.Business;
 list.innerHTML=chosen.map((c,i)=>`
  <article class="course">
   <div class="icon">${i+1}</div>
   <h4>${c[0]}</h4>
   <p>${c[1]}</p>
   <a href="#">View Course →</a>
  </article>`).join('');
}

document.querySelector('#restartBtn').addEventListener('click',()=>{
 current=0;
 Object.keys(answers).forEach(k=>delete answers[k]);
 steps.forEach(s=>{
  s.style.display='';
  s.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));
 });
 result.classList.remove('active');
 actions.style.display='flex';
 progress.parentElement.style.display='block';
 showStep();
});

showStep();
})();
</script>
</body>
</html>
